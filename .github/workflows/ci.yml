name: CI

# PR / main 上的静态检查与构建验证（不推送镜像）
on:
  pull_request:
  push:
    branches: [main]
    paths-ignore:
      - "state/**"
      - "**.md"

permissions:
  contents: read

jobs:
  lint:
    name: 静态检查
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: ShellCheck
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          shellcheck --version
          # 运行期脚本必须是 POSIX sh，--shell=sh 额外校验可移植性
          shellcheck --shell=sh docker/entrypoint.sh docker/healthcheck.sh \
            docker/install-openssh.sh docker/install-gh.sh docker/install-go.sh \
            docker/upstream-launch.sh
          shellcheck scripts/*.sh tests/*.sh

      - name: 语法检查（bash -n / dash -n）
        run: |
          set -euo pipefail
          for f in docker/entrypoint.sh docker/healthcheck.sh docker/install-openssh.sh docker/install-gh.sh docker/install-go.sh; do
            echo "== dash -n $f"
            dash -n "$f"
          done
          for f in scripts/*.sh; do
            echo "== bash -n $f"
            bash -n "$f"
          done

      - name: 脚本自测（不依赖 docker / 不联网）
        run: bash tests/selftest.sh

      - name: Dockerfile（hadolint）
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD:/repo" -w /repo hadolint/hadolint:2.12.0 \
            hadolint --config .hadolint.yaml docker/Dockerfile

      - name: Workflow 语法（actionlint）
        continue-on-error: true
        run: |
          set -euo pipefail
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint -color

      - name: 校验 state / 示例 compose / JSON
        run: |
          set -euo pipefail
          jq empty state/upstream.json
          python3 -m pip install --quiet pyyaml >/dev/null 2>&1 || true
          python3 - <<'PY'
          import glob
          try:
              import yaml
          except ImportError:
              print('未安装 PyYAML，跳过 YAML 解析（jq 与 actionlint 已覆盖主要校验）')
              raise SystemExit(0)
          files = glob.glob('.github/workflows/*.yml') + glob.glob('examples/*.yml')
          for f in files:
              with open(f) as fh:
                  yaml.safe_load(fh)
              print('ok', f)
          PY

  build:
    name: 构建 + 冒烟测试
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 安装冒烟测试依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass

      - name: 设置 Buildx
        uses: docker/setup-buildx-action@v3

      - name: 拉取上游镜像
        run: docker pull smanx/deepseek-harness:devtools-latest

      - name: 生成上游启动桥接脚本
        run: bash scripts/gen-launcher.sh smanx/deepseek-harness:devtools-latest docker/upstream-launch.sh

      - name: 构建（仅本地加载，amd64）
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: dsh:ci
          build-args: |
            BASE_IMAGE=smanx/deepseek-harness:devtools-latest
            SOURCE_URL=https://github.com/${{ github.repository }}
            BUILD_REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 镜像大小
        run: docker image ls dsh:ci

      - name: 导出镜像包（与 Release 附件同一套流程）
        run: |
          set -euo pipefail
          mkdir -p dist
          docker save dsh:ci | gzip -9 > dist/dsh-ci-linux-amd64.tar.gz
          sha256sum dist/*.tar.gz > dist/SHA256SUMS.txt
          ls -lh dist

      - name: 校验镜像包能被 docker load 还原
        run: |
          set -euo pipefail
          docker image rm dsh:ci
          docker load -i dist/dsh-ci-linux-amd64.tar.gz
          docker image inspect dsh:ci >/dev/null
          echo "docker load 还原成功"

      - name: 冒烟测试
        run: bash scripts/smoke-test.sh dsh:ci

      - name: 试跑 Release 说明生成
        env:
          RELEASE_TAG: 0.0.0-ci
          ASSET_DIR: dist
        run: bash scripts/make-release-notes.sh | head -n 30

      - name: 试跑 Release 发布（dry-run，不联网）
        env:
          GITHUB_TOKEN: dummy
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: 0.0.0-ci
          ASSET_DIR: dist
          DRY_RUN: "1"
        run: bash scripts/publish-release.sh

      - name: 失败时输出容器日志
        if: failure()
        run: docker ps -a; docker logs "$(docker ps -aq --filter name=dsh-smoke | head -n 1)" 2>&1 | tail -n 60 || true
